name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'  # Trigger on tags matching v*, like v1.0.0

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read package metadata' }
          $package = $metadata.packages | Where-Object name -eq 'win-locksmith'
          if (-not $package) { throw 'win-locksmith package was not found' }
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'"
          }

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Verify package
        run: cargo package --locked

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
